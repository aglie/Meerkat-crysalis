[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "meerkat-crysalis"
version = "0.1.0"
description = "Reciprocal space reconstruction from CrysAlis Pro frm2hkl exports"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "h5py",
]

[project.scripts]
meerkat-crysalis = "meerkat_crysalis.reconstruct:main"
